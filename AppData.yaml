title: BaseballVision
geometry: "800x700"
resizable: true
objs:
  - type: Frame
    module: tkinter.ttk
    name: frame_control
    attr:
      relief: groove
    method: 
      - name: pack
        attr:
          side: top
          fill: x
          padx: 10
          pady: 10
    objs: 
      - type: Button
        module: tkinter.ttk
        name: btn_select_video
        attr:
          text: "Select Video"
        method: 
          - name: "pack"
            attr:
              side: "left"
              padx: 5
              pady: 5
      - type: Button
        module: tkinter.ttk
        name: btn_process_video
        attr:
          text: "Process"
        method:
          - name: pack
            attr:
              side: right
              padx: 5
              pady: 5
      - type: Button
        module: tkinter.ttk
        name: btn_setting
        attr:
          text: "Model Setting"
        method: 
          - name: pack
            attr:
              side: right
              padx: 5
              pady: 5
      - type: Label
        module: tkinter.ttk
        name: label_video_path
        attr:
          text: "Selected Video: None"
        method: 
          - name: "pack"
            attr:
              side: "left"
              padx: 10
  - type: ScrolledText
    module: tkinter.scrolledtext
    name: text_output
    attr:
      state: disabled
      height: 10
    method: 
      - name: pack
        attr:
          fill: x
          padx: 10
          pady: 10
  - type: Frame
    module: tkinter.ttk
    name: frame_action
    method:
      - name: pack
        attr:
          side: top
          fill: x
          padx: 10
          pady: 10
    objs: 
      - type: Button
        module: tkinter.ttk
        name: btn_graph_setting
        attr:
          text: "Graph Setting"
        method:
          - name: pack
            attr:
              side: right
              padx: 5
              pady: 5
      - type: Button
        module: tkinter.ttk
        name: btn_open_video_player
        attr:
          text: "Show Video"
        method: 
          - name: pack
            attr:
              side: left
              padx: 5
              pady: 5
      #- type: Button
        #module: tkinter.ttk
        #name: btn_play_3d_video
        #attr:
          #text: "Play 3d Video"
        #method: 
          #- name: pack
            #attr:
              #side: left
              #padx: 5
              #pady: 5
  - type: Label
    module: tkinter.ttk
    name: label_display
    method: 
      - name: pack
        attr: 
          fill: both
          expand: true
          padx: 10
          pady: 10